{% set content_product = product or {} %}
<div class="mb-3"><label class="form-label" for="purpose_en" data-ar="استخدام المنتج بالإنجليزية">Product purpose in English</label><input id="purpose_en" name="purpose_en" class="form-control" maxlength="120" value="{{ content_product.purpose_en or '' }}"><small class="text-secondary" data-ar="وصف قصير يظهر على بطاقة المنتج.">A short description shown on the product card.</small></div>
<div class="mb-3"><label class="form-label" for="purpose_ar" data-ar="استخدام المنتج بالعربية">Product purpose in Arabic</label><input id="purpose_ar" name="purpose_ar" class="form-control" maxlength="120" dir="auto" value="{{ content_product.purpose_ar or '' }}"></div>
<div class="mb-3"><label class="form-label" for="description_en" data-ar="وصف المنتج بالإنجليزية">Product description in English</label><textarea id="description_en" name="description_en" class="form-control" maxlength="4000" rows="3">{{ content_product.description_en or '' }}</textarea></div>
<div class="mb-3"><label class="form-label" for="description_ar" data-ar="وصف المنتج بالعربية">Product description in Arabic</label><textarea id="description_ar" name="description_ar" class="form-control" maxlength="4000" rows="3" dir="auto">{{ content_product.description_ar or '' }}</textarea></div>
<div class="mb-4"><label class="form-label" for="product_image" data-ar="صورة المنتج">Product image</label><input id="product_image" name="product_image" type="file" class="form-control" accept="image/png,image/jpeg,image/webp"><small class="text-secondary" data-ar="اختياري، صورة PNG أو JPEG أو WEBP بحد أقصى ٥ ميجابايت. اتركها فارغة للاحتفاظ بالصورة الحالية.">Optional PNG, JPEG or WEBP, maximum 5 MB. Leave empty to keep the current image.</small></div>
