{% extends "base.html" %}{% block title %}Verify account | XPharma{% endblock %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow"><div class="card-body p-4 p-md-5"><p class="section-kicker text-center">One last step</p><h1 class="display-font h2 text-center">Verify your account</h1><p class="text-secondary text-center"><span data-ar="أدخل الرمز المكون من ستة أرقام المرسل إلى">Enter the six-digit code sent to</span> <bdi>{{ email }}</bdi>. <span data-ar="تنتهي صلاحية الرمز بعد ١٠ دقائق.">Codes expire after 10 minutes.</span></p><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="form-label" for="code">Verification code</label><input class="form-control form-control-lg text-center" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button class="btn btn-primary w-100 mt-4">Verify account</button></form><form method="POST" action="{{ url_for('resend_verification') }}" class="mt-3"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-link w-100" type="submit"><span data-ar="إعادة إرسال الرمز">Resend code</span></button></form></div></div></div></div></div>{% endblock %}
